<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="container py-4">

    <h1 class="mb-4">Gestion des commandes</h1>

    <!-- Zone des erreurs -->
    <div id="errorBox" class="alert alert-danger d-none"></div>

    <!-- Indicateurs ) -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card p-3"><small>Clients</small><h3 id="statCustomers"></h3></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3"><small>Produits</small><h3 id="statProducts"></h3></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3"><small>Commandes</small><h3 id="statOrders"></h3></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3"><small>Montant-DH </small><h3 id="statAmount"></h3></div>
      </div>
    </div>

    <!-- Recherche et filtres -->
    <div class="card p-3 mb-4">
      <div class="row g-2">
        <div class="col-md-6">
          <input id="searchInput" class="form-control" placeholder="Nom du client...">
        </div>
        <div class="col-md-3">
          <select id="statusFilter" class="form-select">
            <option value="all">Tous les statuts</option>
            <option value="Livree">Livree</option>
            <option value="En attente">En attente</option>
            <option value="Annulee">Annulee</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="categoryFilter" class="form-select">
            <option value="all">Toutes les categories</option>
          </select>
        </div>
      </div>
    </div>
</div>

    <!-- Tableau des commandes -->
     <div class="table-responsive">
     <table class="table table-bordered align-middle">
     <thead>
     <tr><th> Commande</th><th> Client</th><th> Date</th><th>Statut</th><th> Total</th><th>Action</th></tr>
     </thead>
     <tbody id="ordersBody"></tbody>
     </table>
</div>
    
        
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal : detail d'une commande -->
  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
